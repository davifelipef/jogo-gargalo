<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Gargalo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div>
            <h1>Jogo do Gargalo</h1>
            <p>Dinâmica de fluxo de trabalho</p>
        </div>

        <div class="status">
            <span id="round">Rodada 1</span>
            <span id="wip">WIP: ∞</span>
            <span id="processing-time">Processamento: 4s</span>
            <button id="reset-game" type="button" disabled>Resetar</button>
            <button id="settings" type="button">Configurações</button>
        </div>
    </header>

    <main class="board">
        <section class="column" data-group="1">
            <div class="column-header">
                <div>
                    <h2>Grupo 1</h2>
                    <span>Produção</span>
                </div>

                <button id="create-task" class="add-task" type="button" aria-label="Criar tarefa">
                    +
                </button>
            </div>

            <div class="tasks" id="group-1-tasks"></div>
        </section>

        <section class="column" data-group="2">
            <div class="column-header">
                <div>
                    <h2>Grupo 2</h2>
                    <span>Processamento</span>
                </div>
            </div>

            <div class="tasks" id="group-2-tasks"></div>
        </section>

        <section class="column" data-group="3">
            <div class="column-header">
                <div>
                    <h2>Grupo 3</h2>
                    <span>Conclusão</span>
                </div>
            </div>

            <div class="tasks" id="group-3-tasks"></div>
        </section>
    </main>

    <footer class="footer">
        <div id="completed-tasks" class="completed-tasks">
            <span>Concluídas</span>
            <strong>0</strong>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
