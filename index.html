<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Gargalo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div>
            <h1>Jogo do Gargalo</h1>
            <p>Dinâmica de fluxo de trabalho</p>
        </div>

        <div class="status">
            <span id="round">Rodada 1</span>
            <span id="wip">WIP: ∞</span>
            <span id="processing-time">Processamento: 4s</span>
            <button id="reset-game" type="button" disabled>Resetar</button>
            <button id="settings" type="button">Configurações</button>
        </div>
    </header>

    <main class="board">
        <section class="column" data-group="1">
            <div class="column-header">
                <div>
                    <h2>Grupo 1</h2>
                    <span>Produção</span>
                </div>

                <button id="create-task" class="add-task" type="button" aria-label="Criar tarefa">
                    +
                </button>
            </div>

            <div class="tasks" id="group-1-tasks"></div>
        </section>

        <section class="column" data-group="2">
            <div class="column-header">
                <div>
                    <h2>Grupo 2</h2>
                    <span>Processamento</span>
                </div>
            </div>

            <div class="tasks" id="group-2-tasks"></div>
        </section>

        <section class="column" data-group="3">
            <div class="column-header">
                <div>
                    <h2>Grupo 3</h2>
                    <span>Conclusão</span>
                </div>
            </div>

            <div class="tasks" id="group-3-tasks"></div>
        </section>
    </main>

    <footer class="footer">
        <div id="completed-tasks" class="completed-tasks">
            <span>Concluídas</span>
            <strong>0</strong>
        </div>
    </footer>

    <div id="admin-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-admin-modal" class="modal-close" type="button" aria-label="Fechar">
                ×
            </button>

            <h2 id="admin-modal-title">Acesso administrativo</h2>

            <div id="login-form">
                <p>Digite a senha para acessar as configurações.</p>

                <label for="admin-password">Senha</label>
                <input
                    id="admin-password"
                    type="password"
                    autocomplete="current-password"
                >

                <p id="login-error" class="form-error hidden">
                    Senha incorreta.
                </p>

                <button id="admin-login" type="button">
                    Entrar
                </button>
            </div>

            <div id="settings-form" class="hidden">
                <div class="setting-field">
                    <label for="round-input">Rodada</label>
                    <input id="round-input" type="number" min="1" step="1">
                </div>

                <div class="setting-field">
                    <label for="wip-input">WIP</label>

                    <div class="wip-input">
                        <input id="wip-input" type="number" min="1" step="1">
                        <label>
                            <input id="unlimited-wip" type="checkbox">
                            Ilimitado
                        </label>
                    </div>
                </div>

                <div class="setting-preview">
                    <span>Processamento</span>
                    <strong id="settings-processing-time">4s</strong>
                </div>

                <div class="settings-actions">
                    <button id="save-settings" type="button">
                        Salvar
                    </button>

                    <button id="admin-logout" type="button">
                        Sair
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
