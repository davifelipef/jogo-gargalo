<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Gargalo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div>
            <h1>Jogo do Gargalo</h1>
            <p>Dinâmica de fluxo de trabalho</p>
        </div>

        <div class="status">
            <span id="round">Rodada 1</span>
            <span id="wip">WIP: ∞</span>
            <span id="processing-time">Processamento: 4s</span>
        </div>
    </header>

    <main class="board">
        <section class="column" data-group="1">
            <div class="column-header">
                <h2>Grupo 1</h2>
                <span>Produção</span>
            </div>

            <div class="tasks" id="group-1-tasks"></div>

            <button id="create-task" type="button">
                + Criar tarefa
            </button>
        </section>

        <section class="column" data-group="2">
            <div class="column-header">
                <h2>Grupo 2</h2>
                <span>Processamento</span>
            </div>

            <div class="tasks" id="group-2-tasks"></div>
        </section>

        <section class="column" data-group="3">
            <div class="column-header">
                <h2>Grupo 3</h2>
                <span>Conclusão</span>
            </div>

            <div class="tasks" id="group-3-tasks"></div>
        </section>
    </main>

    <footer class="footer">
        <span id="completed-tasks">Concluídas: 0</span>

        <button id="reset-game" type="button">
            Resetar
        </button>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
